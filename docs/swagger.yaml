      parameters:
      - description: tableUser data
        in: body
        name: tableUser
        required: true
        schema:
          $ref: '#/definitions/tableUserDTO.CreateTableUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: tableUser Created Sucessfully
          schema:
            $ref: '#/definitions/tableUserDTO.TableUserResponse'
        "400":
          description: Bad request error
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
      summary: Create tableUser
      tags:
      - TableUser
  /tables:
    get:
      consumes:
      - application/json
      description: Get list of tables
      produces:
      - application/json
      responses:
        "200":
          description: No content
          schema:
            $ref: '#/definitions/tableDTO.TableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/tableDTO.TableResponse'
      summary: List Tables
      tags:
      - Table
  /user:
    delete:
      consumes:
      - application/json
      description: Delete a userDTO by ID via query parameter
      parameters:
      - description: User ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: No content
          schema:
            type: string
        "400":
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/userDTO.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/userDTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/userDTO.ErrorResponse'
      summary: Delete a User
      tags:

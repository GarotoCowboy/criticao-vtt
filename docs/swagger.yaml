    post:
      consumes:
      - application/json
      description: Create User
      parameters:
      - description: User data
        in: body
        name: tableUser
        required: true
        schema:
          $ref: '#/definitions/userDTO.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User Created sucessfully
          schema:
            $ref: '#/definitions/userDTO.UserResponse'
        "400":
          description: Bad request error
          schema:

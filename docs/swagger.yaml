        "400":
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
      summary: Delete a TableUser
      tags:
      - TableUser
    get:
      consumes:
      - application/json
      description: Get a table tableUser by ID via query parameter
      parameters:
      - description: Table User ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: No content
          schema:
            $ref: '#/definitions/tableUserDTO.TableUserResponse'
        "400":
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/tableUserDTO.ErrorResponse'
      summary: Get TableUser
